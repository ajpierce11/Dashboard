[server]
runOnSave = true

# AbbVie brand palette, dark-mode variant.
# Background is a very dark blue-black (rooted in AbbVie Dark Blue #071D49
# but deepened so long content stays readable), secondary background is a
# slightly lighter slate, and primary/accent is AbbVie Medium Blue —
# which becomes the pop color in place of Dark Blue now that Dark Blue
# would vanish into the background.
[theme]
base = "dark"
primaryColor = "#A6B5E0"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#1A2438"
textColor = "#EDF0FF"
